# Ultralytics YOLO11s - Improved Swin Transformer (Corrected Channels)
nc: 1
names: ['UAV']
scales:
  s: [0.50, 0.50, 1024]

# ----------------- BACKBONE -----------------
backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0 (320x320)
  - [-1, 1, Conv, [128, 3, 2]]   # 1 (160x160)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: Out 128 channels
  - [-1, 1, Conv, [256, 3, 2]]   # 3 (80x80)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]   # 5
  - [-1, 2, C3k2, [512, True]]   # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7
  - [-1, 2, C3k2, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9
  - [-1, 2, C2PSA, [1024]]       # 10

# ----------------- SWIN BRANCH -----------------
  - [1, 1, Conv, [512, 3, 1]]    # 11: In 64, Out 128 (256*0.5)
  - [-1, 1, SwinTransformer, [256]] # 12: In 128, Out 128 (256*0.5)

# ----------------- HEAD -----------------
head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 6], 1, Concat, [1]]    # 14
  - [-1, 2, C3k2, [512, False]]  # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]]    # 17
  - [-1, 2, C3k2, [256, False]]  # 18: Out 128 channels

  - [-1, 1, Conv, [256, 3, 2]]   # 19
  - [[-1, 15], 1, Concat, [1]]   # 20
  - [-1, 2, C3k2, [512, False]]  # 21
  - [-1, 1, Conv, [512, 3, 2]]   # 22
  - [[-1, 10], 1, Concat, [1]]   # 23
  - [-1, 2, C3k2, [1024, True]]  # 24

  # 3-WAY FUSION (Fix lỗi 320 vs 384)
  - [18, 1, nn.Upsample, [None, 2, "nearest"]] # 25 (80->160, 128ch)
  - [[2, 12, 25], 1, Concat, [1]] # 26: 128 + 128 + 128 = 384 channels
  - [-1, 1, Conv, [256, 3, 1]]    # 27: Nhận 384, Out 128

  - [[18, 21, 24, 27], 1, Detect, [nc]] # 28: P3, P4, P5, Fusions
# YOLO11s + Swin Transformer - SIMPLE VERSION
# Test file to verify Swin integration works

nc: 1  # UAV only
scales:
  s: [0.50, 0.50, 1024]

# BACKBONE (layers 0-12)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0: 640→320
  - [-1, 1, Conv, [128, 3, 2]]             # 1: 320→160
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2: 160×160
  - [-1, 1, Conv, [256, 3, 2]]             # 3: 160→80
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4: 80×80
  - [-1, 1, Conv, [512, 3, 2]]             # 5: 80→40
  - [-1, 2, C3k2, [512, True]]             # 6: 40×40
  - [-1, 1, Conv, [1024, 3, 2]]            # 7: 40→20
  - [-1, 2, C3k2, [1024, True]]            # 8: 20×20
  - [-1, 1, SPPF, [1024, 5]]               # 9: 20×20
  - [-1, 2, C2PSA, [1024]]                 # 10: 20×20
  
  # SWIN BRANCH - đơn giản từ layer 2
  - [2, 1, SwinTransformer, [256]]         # 11: từ C3k2 layer 2 (160×160)

# HEAD (layers 12-24)
head:
  # FPN
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 12: 20→40
  - [[-1, 6], 1, Concat, [1]]                    # 13: cat P4
  - [-1, 2, C3k2, [512, False]]                  # 14: 40×40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15: 40→80
  - [[-1, 4], 1, Concat, [1]]                    # 16: cat P3
  - [-1, 2, C3k2, [256, False]]                  # 17: 80×80 (P3)

  # PAN
  - [-1, 1, Conv, [256, 3, 2]]                  # 18: 80→40
  - [[-1, 14], 1, Concat, [1]]                   # 19: cat P4
  - [-1, 2, C3k2, [512, False]]                  # 20: 40×40 (P4)

  - [-1, 1, Conv, [512, 3, 2]]                  # 21: 40→20
  - [[-1, 10], 1, Concat, [1]]                   # 22: cat P5
  - [-1, 2, C3k2, [1024, True]]                  # 23: 20×20 (P5)

  # 2-WAY SWIN FUSION (đơn giản hơn)
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]  # 24: P3 80→160
  - [[11, 24], 1, Concat, [1]]                   # 25: Swin + Upsample P3
  - [-1, 1, Conv, [256, 3, 1]]                  # 26: Fusion conv

  # DETECT (4 heads)
  - [[17, 20, 23, 26], 1, Detect, [nc]]         # 27: P3, P4, P5, Fusion
